version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - pip3 install aws-sam-cli
      - cd backend/lambdas && npm install && cd ../..

  build:
    commands:
      - cd backend/infra && sam build --template template.yaml --base-dir ..
      - cd backend/infra && sam package --template-file .aws-sam/build/template.yaml --output-template-file packaged.yaml --s3-bucket $SAM_ARTIFACT_BUCKET --region $AWS_DEFAULT_REGION

artifacts:
  files:
    - packaged.yaml
  base-directory: backend/infra
